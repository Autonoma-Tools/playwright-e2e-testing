name: Preview Deployment Tests

# The `deployment_status` event fires whenever a deployment (Vercel, Netlify,
# Render, etc.) posts a status update to GitHub. We read the resulting URL
# straight off the event payload — no polling, no sleep loops, no third-party
# actions required.
on:
  deployment_status

jobs:
  playwright:
    # Only run once the deployment has finished successfully. 'pending' and
    # 'failure' states will also fire this workflow, so the guard is required.
    if: ${{ github.event.deployment_status.state == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # deployment_status events carry the SHA of the commit that was
          # deployed, which may lag main. Check that out so our tests match.
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright against preview URL
        env:
          # environment_url is set by Vercel (and most other providers) to the
          # unique preview URL for this deployment — e.g.
          # https://my-app-git-feat-x-acme.vercel.app
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

